name: sarc-round3-publish
on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: ['.github/workflows/sarc-round3-publish.yml']
permissions:
  contents: write
concurrency:
  group: sarc-round3-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate baseline and publish recovered bytes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, shutil, subprocess
          from pathlib import Path
          branch = 'docs/restore-6601-screenshots'
          allowed = {
              '6601芯片截图/RESTORE_PROGRESS.md',
              '6601芯片截图/reviews/SARC_LLD_ROUND3_IMAGE_LEDGER_20261005.json',
              '6601芯片截图/reviews/SARC_LLD_ROUND3_REVIEW_20261005.md',
              '6601芯片截图/reviews/SARC_LLD_ROUND3_VERIFY_20261005.json',
              '6601芯片截图/sarc/SARC_6601修改点总览.md',
              '6601芯片截图/sarc/SARC_提取与验收报告.md',
              '6601芯片截图/sarc/sarc_lld/docs/SARC_LLD设计文档.md',
              'NEXT_CHAT_HANDOFF.md',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def remote_head():
              return git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0]
          head = git('rev-parse', 'HEAD')
          if os.environ['GITHUB_REF'] != 'refs/heads/' + branch or remote_head() != head:
              raise SystemExit('Branch changed; refuse publication')
          parts = [Path(f'.restore_transport/sarc_round3/part{i:02d}.txt') for i in range(4)]
          encoded = b''.join(p.read_bytes().strip() for p in parts)
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest() != 'eb225bdd2082a62b2e87d103ab446c8ae453acf2334e49c1c7673ef1d7a954f3':
              raise SystemExit('Recovered payload checksum mismatch')
          bundle = json.loads(raw)
          if bundle['format'] != 'exact_utf8_char_spans_v1' or bundle['branch'] != branch:
              raise SystemExit('Wrong payload format or branch')
          if bundle['input_head'] != '3d8da927cc13d4f8b6edd4d48001f2769f8365b7':
              raise SystemExit('Wrong review baseline')
          if len(bundle['files']) != 8 or {f['path'] for f in bundle['files']} != allowed:
              raise SystemExit('Unexpected target set')
          outputs = {}
          for f in bundle['files']:
              p = Path(f['path'])
              if p.is_symlink():
                  raise SystemExit('Symlink target refused')
              if f['old_blob'] is None:
                  if p.exists():
                      raise SystemExit('New target already exists: ' + str(p))
                  text = f['content']
              else:
                  data = p.read_bytes()
                  if blob(data) != f['old_blob']:
                      raise SystemExit('Concurrent target change: ' + str(p))
                  old = data.decode('utf-8')
                  chunks = []
                  cursor = 0
                  for start, end, replacement in f['edits']:
                      if not 0 <= cursor <= start <= end <= len(old):
                          raise SystemExit('Invalid edit range')
                      chunks.extend([old[cursor:start], replacement])
                      cursor = end
                  chunks.append(old[cursor:])
                  text = ''.join(chunks)
              data = text.encode('utf-8')
              if len(data) != f['bytes'] or blob(data) != f['new_blob'] or hashlib.sha256(data).hexdigest() != f['sha256']:
                  raise SystemExit('Output checksum mismatch: ' + str(p))
              outputs[f['path']] = data
          ledger_path = '6601芯片截图/reviews/SARC_LLD_ROUND3_IMAGE_LEDGER_20261005.json'
          ledger = json.loads(outputs[ledger_path])
          for item in ledger['images']:
              data = Path(item['path']).read_bytes()
              if len(data) != item['bytes'] or blob(data) != item['blob_sha'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit('Original image changed: ' + item['path'])
          for path, data in outputs.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', '--', *sorted(allowed))
          cleanup = [str(p) for p in parts] + ['.github/workflows/sarc-round3-recover.yml', '.github/workflows/sarc-round3-publish.yml']
          git('rm', '--', *cleanup)
          if remote_head() != head:
              raise SystemExit('Remote changed before commit; refuse push')
          git('commit', '-m', 'docs(sarc): recover and publish round3 review')
          commit = git('rev-parse', 'HEAD')
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], check=True)
          if remote_head() != commit:
              raise SystemExit('Remote changed after push; verify latest head')
          out = Path('readback_output')
          out.mkdir()
          records = []
          for path, expected in outputs.items():
              actual = subprocess.check_output(['git', 'show', 'HEAD:' + path])
              if actual != expected:
                  raise SystemExit('Committed bytes mismatch: ' + path)
              dst = out / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(actual)
              records.append({'path': path, 'bytes': len(actual), 'git_blob': blob(actual), 'sha256': hashlib.sha256(actual).hexdigest()})
          report = {'commit': commit, 'remote_head': commit, 'branch': branch, 'recovery_input_head': head, 'review_input_head': bundle['input_head'], 'recovered_payload_sha256': hashlib.sha256(raw).hexdigest(), 'file_count': len(records), 'files': records, 'temporary_transport_removed': True, 'lld_first_pass': 31, 'new_review_range': [15,31], 'unresolved_reviewed_groups': 12, 'remaining_lld_images': 9, 'final_text_acceptance': False, 'note': 'Recovery and exact-byte publication of prior review. Not a new independent visual review. The prior response interruption root cause is unknown.'}
          (out / 'READBACK.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Published commit:', commit)
          print('Verified recovered targets:', len(records))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarc-round3-readback
          path: readback_output/
          retention-days: 3
          if-no-files-found: error
