name: sarc-source-bundle

on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: ['.github/workflows/sarc-source-bundle.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Export original SARC images and current text
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import zipfile

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          raw = subprocess.check_output(['git', 'ls-tree', '-rlz', 'HEAD'])
          inventory = []
          for item in raw.split(b'\0'):
              if not item:
                  continue
              meta, path = item.split(b'\t', 1)
              mode, kind, sha, size = meta.decode().split()
              inventory.append({'path': path.decode('utf-8'), 'type': kind,
                                'blob_sha': sha, 'bytes': int(size)})
          manifest = {'source_commit': head, 'module': 'sarc',
                      'original_bytes_preserved': True,
                      'inventory_order_is_not_document_reading_order': True,
                      'repository_inventory': inventory, 'exported_files': []}
          out = Path('sarc_source_export')
          out.mkdir()
          with zipfile.ZipFile(out / 'sources.zip', 'w', zipfile.ZIP_STORED) as archive:
              for item in inventory:
                  path = Path(item['path'])
                  if '.review_cache' in path.parts:
                      continue
                  is_text = path.suffix.lower() in {'.md', '.json', '.txt', '.csv', '.yml', '.yaml', '.py'}
                  is_sarc_image = tuple(path.parts[:2]) == ('6601芯片截图', 'sarc') and path.suffix.lower() in {'.png', '.jpg', '.jpeg', '.webp'}
                  if not (is_text or is_sarc_image):
                      continue
                  data = path.read_bytes()
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if actual != item['blob_sha']:
                      raise SystemExit('Original blob mismatch: ' + str(path))
                  archive.writestr(str(path), data)
                  manifest['exported_files'].append({**item, 'sha256': hashlib.sha256(data).hexdigest()})
              archive.writestr('SOURCE_MANIFEST.json', json.dumps(manifest, ensure_ascii=False, indent=2))
          print('Pinned commit:', head)
          print('Exported files:', len(manifest['exported_files']))
          print('No resizing, OCR, or document acceptance performed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sarc-original-sources
          path: sarc_source_export/sources.zip
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
