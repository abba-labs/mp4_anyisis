name: SARC gap12 bounded save
on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: [.github/workflows/sarc-gap12-save.yml]
permissions:
  contents: write
concurrency:
  group: sarc-restore-save
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/restore-6601-screenshots
          fetch-depth: 0
      - name: Validate bounded edits, publish and compare fetched remote bytes
        shell: python
        run: |
          import pathlib,json,hashlib,subprocess,zipfile,os
          R=12
          branch='docs/restore-6601-screenshots'
          def git(*a): return subprocess.check_output(['git',*a])
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def dump(x): return (json.dumps(x,ensure_ascii=False,indent=2)+'\n').encode()
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          payload=f'6601芯片截图/reviews/.sarc_gap_round{R}.json'
          workflow=f'.github/workflows/sarc-gap{R}-save.yml'
          spec=json.loads(pathlib.Path(payload).read_bytes());assert spec['round']==R
          subprocess.run(['git','merge-base','--is-ancestor',spec['input_head'],'HEAD'],check=True)
          prepared={}
          for f in spec['files']:
              p=pathlib.Path(f['path']);assert not p.is_absolute() and '..' not in p.parts
              old=p.read_bytes() if p.exists() else None
              assert (blob(old) if old is not None else None)==f['old'],'stale '+str(p)
              if 'content' in f: text=f['content']
              else:
                  text=old.decode()
                  for a,b in f['patches']:
                      assert text.count(a)==1,'ambiguous edit '+str(p)
                      text=text.replace(a,b)
              b=text.encode();assert blob(b)==f['expected'],'output mismatch '+str(p)
              prepared[str(p)]=b
          lrs='6601芯片截图/sarc/sarc_lrs/docs/SARC_LRS设计文档.md'
          assert blob(pathlib.Path(lrs).read_bytes())=='c497dc3be8154b9e8dece6f467b7ee015acc4189'
          for image in spec['images']:
              b=pathlib.Path(image['path']).read_bytes();assert blob(b)==image['blob']
              image.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),status='targeted_rechecked')
          prefix=f'6601芯片截图/reviews/SARC_GAP_ROUND{R}_'
          ledger=prefix+'IMAGE_LEDGER_20261005.json'
          assert not pathlib.Path(ledger).exists()
          prepared[ledger]=dump({k:spec[k] for k in ['round','input_head','images','closed','remaining','next_gap','next_image']})
          for n,b in prepared.items():
              p=pathlib.Path(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          for n in [payload,workflow]: pathlib.Path(n).unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*prepared,payload,workflow],check=True)
          staged=set(git('diff','--cached','--name-only','-z').decode().strip('\0').split('\0'))
          assert staged==set(prepared)|{payload,workflow},'unexpected staged paths'
          subprocess.run(['git','commit','-m','docs(sarc): close AUX-U02 and record remaining sources'],check=True)
          commit=git('rev-parse','HEAD').decode().strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          subprocess.run(['git','fetch','origin','refs/heads/'+branch],check=True)
          remote=git('rev-parse','FETCH_HEAD').decode().strip()
          for n,b in prepared.items(): assert git('show',remote+':'+n)==b,'remote mismatch '+n
          assert blob(git('show',remote+':'+lrs))=='c497dc3be8154b9e8dece6f467b7ee015acc4189'
          receipt={k:spec[k] for k in ['round','input_head','closed','remaining','next_gap','next_image']}
          receipt.update(branch=branch,content_commit=commit,remote_head_at_readback=remote,run_id=int(os.environ['GITHUB_RUN_ID']),publication_status='remote_saved_and_git_fetch_byte_verified',all_target_bytes_match=True,temporary_files_removed=True,final_acceptance=False,lrs_round11_preserved=True,files=[{'path':n,'git_blob':blob(b),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()} for n,b in prepared.items()])
          name=prefix+'REMOTE_SAVE_20261005.json';pathlib.Path(name).write_bytes(dump(receipt))
          subprocess.run(['git','add','--',name],check=True)
          subprocess.run(['git','commit','-m','docs(sarc): record round12 remote readback'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          subprocess.run(['git','fetch','origin','refs/heads/'+branch],check=True)
          assert git('show','FETCH_HEAD:'+name)==pathlib.Path(name).read_bytes()
          prepared[name]=pathlib.Path(name).read_bytes()
          with zipfile.ZipFile(f'sarc-gap{R}-readback.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n,b in prepared.items(): z.writestr(n,b)
          print('CONTENT_COMMIT',commit,'RECEIPT_COMMIT',git('rev-parse','HEAD').decode().strip())
      - uses: actions/upload-artifact@v4
        with:
          name: sarc-gap12-full-readback
          path: sarc-gap12-readback.zip
          retention-days: 3
          if-no-files-found: error
