name: Full recording reconstruction validation
on:
  workflow_dispatch:
  push:
    branches: [feat/open-source-thin-pipeline-20260928]
    paths: [.github/workflows/full-recording.yml]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PADDLE_PDX_MODEL_SOURCE: HF
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: ppstructure-3.7.0-paddlex-3.7.2-mobile-v1
          restore-keys: ppstructure-3.7.0-paddlex-3.7.2-models-
      - name: Preserve and verify original full artifact before extracting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation/full_recording
          gh api repos/abba-labs/mp4_anyisis/actions/artifacts/10972954977 > validation/full_recording/original_metadata.json
          gh api repos/abba-labs/mp4_anyisis/actions/artifacts/10972954977/zip > validation/full_recording/original_10972954977.zip
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('validation/full_recording')
          evidence=json.loads(Path('docs/handoff_evidence_2026-09-28.json').read_text())
          metadata=json.loads((root/'original_metadata.json').read_text())
          archive=root/'original_10972954977.zip'
          expected=evidence['artifact']['zip_sha256']
          if metadata['expired'] or metadata['workflow_run']['id'] != evidence['workflow_run_id']:
              raise RuntimeError('wrong or expired source artifact')
          if metadata['digest'] != 'sha256:'+expected or hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise RuntimeError('original artifact hash mismatch')
          target=(root/'restored').resolve()
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  if target not in (target/name).resolve().parents:
                      raise ValueError('unsafe ZIP member')
              z.extractall(target)
          freeze=(target/'environment.txt').read_text().splitlines()
          (root/'constraints.txt').write_text('\n'.join(x for x in freeze if '==' in x and not x.startswith('-e '))+'\n')
          print('ORIGINAL_ZIP_SHA256',expected)
          PY
      - name: Match saved environment and test pinned adapters
        run: |
          python -m pip install -c validation/full_recording/constraints.txt -e '.[parser,dev]' 'python-docx==1.2.0'
          python -m pip check
          python -m pip freeze > validation/full_recording/environment.txt
          python --version > validation/full_recording/python_version.txt
          python -m pytest -q --junitxml=validation/full_recording/tests.xml
          git rev-parse HEAD > validation/full_recording/tested_commit.txt
          git archive HEAD src tests scripts pyproject.toml README.md NEXT_CHAT_HANDOFF.md docs/handoff_evidence_2026-09-28.json .github/workflows/full-recording.yml > validation/full_recording/tested_source.tar
      - name: Resume exact 57-job plan and verify prior 31 cache hits
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=15 600 python -u scripts/resume_full_recording.py validation/full_recording/restored/sarc 2>&1 | tee validation/full_recording/resume.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-recording-resumed-validation
          path: validation/full_recording/
          retention-days: 30
