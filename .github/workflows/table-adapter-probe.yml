name: Native table adapter probe
on:
  workflow_dispatch:
  push:
    branches: [feat/open-source-thin-pipeline-20260928]
    paths: [.github/workflows/table-adapter-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PADDLE_PDX_MODEL_SOURCE: HF
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: ppstructure-3.7.0-paddlex-3.7.2-models-v1
      - name: Install unchanged upstream engines
        run: |
          python -m pip install -e '.[parser,dev]'
          mkdir -p validation/table_probe
          python -m pip freeze > validation/table_probe/environment.txt
      - name: Compare full image, viewport, and native cell geometry
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10 600 python -u - <<'PY' 2>&1 | tee validation/table_probe/run.log
          import hashlib,json,re,time,traceback
          from pathlib import Path
          import av
          from PIL import Image
          from paddleocr import PPStructureV3
          from mp4_analysis.thin.parser import NativeParser
          from scripts.check_native_samples import sheet_cells
          out=Path('validation/table_probe')
          source=Path('MP4/GameViewer_96iLJ4Cokv.mp4')
          fixture=json.loads(Path('tests/fixtures/native_acceptance.json').read_text(encoding='utf-8'))['memorymap']
          with av.open(str(source)) as video:
              for i,f in enumerate(video.decode(video.streams.video[0])):
                  if i==60:
                      full=f.to_image().convert('RGB');pts=float(f.pts*f.time_base);break
              else: raise RuntimeError('source frame 60 missing')
          full.save(out/'source_frame_60.png')
          (out/'source.json').write_text(json.dumps({'video':str(source),'frame_index':60,'pts_seconds':pts,'sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'fixture':fixture},ensure_ascii=False,indent=2),encoding='utf-8')
          start=time.monotonic();engine=PPStructureV3(**NativeParser().options)
          init=round(time.monotonic()-start,4)
          cases=[('full_default',None,1,{}),('full_cells',None,1,{'use_wired_table_cells_trans_to_html':True,'use_wireless_table_cells_trans_to_html':True}),('viewport_default',(18,0,1660,675),1,{}),('viewport_cells',(18,0,1660,675),1,{'use_wired_table_cells_trans_to_html':True,'use_wireless_table_cells_trans_to_html':True}),('viewport_cells_2x',(18,0,1660,675),2,{'use_wired_table_cells_trans_to_html':True,'use_wireless_table_cells_trans_to_html':True})]
          summary=[]
          for name,crop,scale,options in cases:
              folder=out/name;folder.mkdir();image=full.copy() if crop is None else full.crop(crop)
              if scale!=1:image=image.resize((image.width*scale,image.height*scale),Image.Resampling.LANCZOS)
              path=folder/'source.png';image.save(path)
              item={'name':name,'source_frame':60,'source_crop_xyxy':crop,'scale':scale,'predict_options':options,'initialization_seconds':init,'full_video_verified':False}
              start=time.monotonic()
              try:
                  result=next(iter(engine.predict(str(path),**options)))
                  item['inference_seconds']=round(time.monotonic()-start,4)
                  errors=[]
                  for method in ['save_to_json','save_to_markdown','save_to_html','save_to_xlsx','save_to_word']:
                      try:getattr(result,method)(save_path=str(folder))
                      except Exception as exc:errors.append({'stage':method,'error':str(exc)})
                  tables=[]
                  for book in sorted(folder.glob('*.xlsx')):
                      cells,dimension=sheet_cells(book)
                      end_col=re.sub('[^A-Z]','',(dimension or '').split(':')[-1]);columns=0
                      for letter in end_col:columns=columns*26+ord(letter)-64
                      mismatches=[{'cell':cell,'expected':expected,'actual':cells.get(cell,'')} for cell,expected in fixture['cells'].items() if re.sub(r'\s+','',cells.get(cell,''))!=re.sub(r'\s+','',expected)]
                      tables.append({'file':book.name,'dimension':dimension,'columns':columns,'matched_anchors':len(fixture['cells'])-len(mismatches),'mismatches':mismatches,'anchor_checks_passed':columns==fixture['required_columns'] and not mismatches})
                  item.update(status='ran',exports_errors=errors,tables=tables,anchor_checks_passed=len(tables)==1 and tables[0]['anchor_checks_passed'])
                  print('CASE',json.dumps(item,ensure_ascii=False),flush=True)
              except Exception:
                  item.update(status='failed',error=traceback.format_exc(),anchor_checks_passed=False)
                  print(item['error'],flush=True)
              item['total_seconds']=round(time.monotonic()-start,4);summary.append(item)
              (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          report={'experiment_execution_complete':len(summary)==len(cases) and all(x['status']=='ran' for x in summary),'any_anchor_passed':any(x['anchor_checks_passed'] for x in summary),'full_video_verified':False,'note':'A configuration experiment. No export content was corrected to match the fixture. A sample PASS is not full table or video acceptance.','cases':summary}
          (out/'acceptance.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          if not report['experiment_execution_complete']:raise RuntimeError('Native experiment failed; see acceptance.json')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-table-adapter-probe
          path: validation/table_probe/
          retention-days: 7
