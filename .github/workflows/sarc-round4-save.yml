name: SARC round4 bounded save
on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: [.github/workflows/sarc-round4-save.yml]
permissions:
  contents: write
concurrency:
  group: sarc-restore-branch-save
  cancel-in-progress: false
jobs:
  save:
    if: github.ref == 'refs/heads/docs/restore-6601-screenshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/restore-6601-screenshots
          fetch-depth: 0
      - name: Validate bounded edits and publish without force
        shell: python
        run: |
          import base64,zlib,json,hashlib,subprocess,pathlib
          def git(*args): return subprocess.check_output(['git',*args])
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          hashes=['716111fb6f42b11f05312076e352a2ac736de432','7f275c8cd747a198918a24ec8565e35b36acacd7','59cf9f18ab808733f89d736dcd9ff8839b339920','4123b30f93e9993e5c069af358af8dda9e33ba3e','2e4325847673b1b6249aebf001ac4cf8cdf493f4']
          parts=[f'6601芯片截图/reviews/.round4_transport_{i}.txt' for i in range(1,6)]
          encoded=''
          for name,expected in zip(parts,hashes):
              b=pathlib.Path(name).read_bytes()
              assert blob(b)==expected,name+' transport mismatch '+blob(b)
              encoded+=b.decode('ascii').strip()
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='cd1036e5dae160956c79be64f88e7bde85c972037b65724a24de0dd19555ad83'
          spec=json.loads(raw)
          branch='docs/restore-6601-screenshots'
          assert spec['branch']==branch
          subprocess.run(['git','merge-base','--is-ancestor',spec['input_head'],'HEAD'],check=True)
          def checked(b,f):
              assert len(b)==f['bytes'] and blob(b)==f['new_blob'] and hashlib.sha256(b).hexdigest()==f['new_sha256'],f['path']+' output mismatch'
          prepared={}
          for f in spec['files']:
              p=pathlib.Path(f['path'])
              assert not p.is_absolute() and '..' not in p.parts
              old=p.read_bytes() if p.exists() else None
              assert (blob(old) if old is not None else None)==f['old_blob'],str(p)+' stale blob'
              if 'content' in f: text=f['content']
              elif 'patches' in f:
                  text=old.decode('utf-8')
                  for op in sorted(f['patches'],key=lambda o:o['start'],reverse=True): text=text[:op['start']]+op['new']+text[op['end']:]
              else:
                  tr=f['json_transform'];b=pathlib.Path(tr['base_path']).read_bytes()
                  assert blob(b)==tr['base_blob']
                  obj=json.loads(b);obj.update(tr['updates'])
                  for row in obj['images']: row.update(tr['image_updates'].get(str(row['order']),{}))
                  text=json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
              b=text.encode('utf-8');checked(b,f);prepared[str(p)]=b
          for path,b in prepared.items():
              p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          workflow='.github/workflows/sarc-round4-save.yml'
          temporary=parts+[workflow]
          for path in temporary: pathlib.Path(path).unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*prepared.keys(),*temporary],check=True)
          staged=set(git('diff','--cached','--name-only','-z').decode().strip('\0').split('\0'))
          assert staged==set(prepared)|set(temporary),staged
          subprocess.run(['git','commit','-m','docs: restore SARC LLD screenshots 32-36 with source gaps and checkpoint'],check=True)
          commit=git('rev-parse','HEAD').decode().strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          subprocess.run(['git','fetch','origin','refs/heads/'+branch],check=True)
          remote=git('rev-parse','FETCH_HEAD').decode().strip()
          out=pathlib.Path('.checkpoint_readback');out.mkdir(exist_ok=True)
          for f in spec['files']:
              b=git('show',remote+':'+f['path']);checked(b,f)
              p=out/f['path'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          receipt={'branch':branch,'input_head':spec['input_head'],'commit':commit,'remote_head_at_readback':remote,'all_remote_files_match_expected_bytes':True,'temporary_transport_and_workflow_deleted':True,'initial_failed_run':37280916258,'initial_failure':'Invalid inline payload; decoding failed before any document write. Replaced with hash-checked short parts.','files':[{k:f[k] for k in ['path','new_blob','new_sha256','bytes']} for f in spec['files']]}
          (out/'READBACK.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Published and remote-verified',commit,len(prepared),'files')
      - uses: actions/upload-artifact@v4
        with:
          name: sarc-round4-remote-readback
          path: .checkpoint_readback/
          retention-days: 3
          if-no-files-found: error
