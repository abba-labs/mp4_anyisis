name: sarc-round3-recover
on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: ['.github/workflows/sarc-round3-recover.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover saved data without applying or executing it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, lzma, zlib
          source = Path('.restore_transport/sarc_round3')
          out = Path('recovery_output')
          out.mkdir()
          parts = [source / f'part{i:02d}.txt' for i in range(4)]
          manifest = []
          for p in parts:
              raw = p.read_bytes()
              (out / p.name).write_bytes(raw)
              manifest.append({'path': str(p), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          encoded = b''.join(p.read_bytes().strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          (out / 'decoded_payload.bin').write_bytes(data)
          if data.startswith(b'\xfd7zXZ\x00'):
              plain = lzma.decompress(data)
              fmt = 'xz'
          elif data.startswith(b'\x1f\x8b'):
              plain = gzip.decompress(data)
              fmt = 'gzip'
          elif data.startswith(b'x'):
              plain = zlib.decompress(data)
              fmt = 'zlib'
          else:
              plain = data
              fmt = 'uncompressed'
          if len(plain) > 5000000:
              raise SystemExit('Unexpected payload size')
          (out / 'payload.json').write_bytes(plain)
          obj = json.loads(plain)
          report = {'parts': manifest, 'compression': fmt, 'decoded_bytes': len(data), 'json_bytes': len(plain), 'json_sha256': hashlib.sha256(plain).hexdigest(), 'top_level_type': type(obj).__name__, 'top_level_keys': list(obj) if isinstance(obj, dict) else None, 'applied_to_documents': False}
          (out / 'RECOVERY.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarc-round3-recovered-payload
          path: recovery_output/
          retention-days: 3
          if-no-files-found: error
