name: SARC auxiliary round6 checkpoint
on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: [.github/workflows/sarc-round6-save.yml]
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/restore-6601-screenshots
          fetch-depth: 0
      - name: Validate bounded data, publish, fetch and compare remote bytes
        shell: python
        run: |
          import pathlib,hashlib,json,base64,zlib,subprocess,os,zipfile
          P=pathlib.Path
          def git(*a): return subprocess.check_output(['git',*a])
          def run(*a): subprocess.run(['git',*a],check=True)
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          branch='docs/restore-6601-screenshots'
          assert git('branch','--show-current').decode().strip()==branch
          names=[f'6601芯片截图/reviews/.round6_transport_{i}.txt' for i in range(1,4)]
          staged_hashes=['c2e3ea82b56e2c1e097d13336708b0b993a826b6','fa50f4de07e076a521fd3ebc437c199fc0a2d4ef','48e63c918877f2bde709f73bdf3da3c0e2e8727a']
          expected_hashes=['aa1214970c8e73b3960d4b3087b8312632563a84','fa50f4de07e076a521fd3ebc437c199fc0a2d4ef','361470327724e5c507a1d8f4fb266bd9da98d726']
          corrections={0:[('ByvHLNr5','ByvNr5'),('fP7wRdi39d0','fP7wR/di39d0')],2:[('OxzXdXYfc9HVnT2','OxzXdXYfc9ye1i+Pa0Wn9HVnT2')]}
          encoded=''
          for i,n in enumerate(names):
              b=P(n).read_bytes(); assert blob(b)==staged_hashes[i]
              t=b.decode('ascii')
              for a,c in corrections.get(i,[]):
                  assert t.count(a)==1
                  t=t.replace(a,c)
              assert blob(t.encode('ascii'))==expected_hashes[i]
              encoded+=t.strip()
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='7bf2690ccd173e65dc0ac7dcf26f0799d3b84b121531e8835c2e5745ac60aa5e'
          spec=json.loads(raw); assert spec['branch']==branch
          run('merge-base','--is-ancestor',spec['input_head'],'HEAD')
          prepared={}
          allowed={'NEXT_CHAT_HANDOFF.md','6601芯片截图/RESTORE_PROGRESS.md','6601芯片截图/sarc/SARC_6601修改点总览.md','6601芯片截图/sarc/SARC_提取与验收报告.md','6601芯片截图/sarc/sarc_diagrams/docs/SARC功能框图说明.md','6601芯片截图/reviews/SARC_AUX_ROUND6_IMAGE_LEDGER_20261005.json','6601芯片截图/reviews/SARC_AUX_ROUND6_REVIEW_20261005.md','6601芯片截图/reviews/SARC_AUX_ROUND6_VERIFY_20261005.json'}
          assert {f['path'] for f in spec['files']}==allowed
          def checked(b,f):
              assert len(b)==f['bytes'] and blob(b)==f['new_blob'] and hashlib.sha256(b).hexdigest()==f['new_sha256'],f['path']
          for f in spec['files']:
              p=P(f['path']); b=p.read_bytes() if p.exists() else None
              assert (blob(b) if b is not None else None)==f['old_blob'],f['path']+' stale input'
              if 'content' in f: t=f['content']
              else:
                  t=b.decode('utf-8')
                  for op in sorted(f['patches'],key=lambda x:x['start'],reverse=True):
                      assert 0<=op['start']<=op['end']<=len(t)
                      t=t[:op['start']]+op['new']+t[op['end']:]
              b=t.encode('utf-8'); checked(b,f); prepared[str(p)]=b
          ledger=json.loads(prepared['6601芯片截图/reviews/SARC_AUX_ROUND6_IMAGE_LEDGER_20261005.json'])
          for row in ledger['images']:
              b=P(row['path']).read_bytes()
              assert len(b)==row['bytes'] and blob(b)==row['blob_sha'] and hashlib.sha256(b).hexdigest()==row['sha256']
          for n,b in prepared.items():
              p=P(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          temporary=names+['.github/workflows/sarc-round6-save.yml']
          for n in temporary: P(n).unlink()
          run('config','user.name','github-actions[bot]')
          run('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('add','--',*prepared.keys(),*temporary)
          staged=set(git('diff','--cached','--name-only','-z').decode().strip('\0').split('\0'))
          assert staged==allowed|set(temporary)
          run('commit','-m','docs(sarc): restore first five auxiliary sources')
          commit=git('rev-parse','HEAD').decode().strip()
          run('push','origin','HEAD:refs/heads/'+branch)
          run('fetch','origin','refs/heads/'+branch)
          remote=git('rev-parse','FETCH_HEAD').decode().strip()
          out=P('checkpoint_readback');out.mkdir(exist_ok=True)
          for f in spec['files']:
              b=git('show',remote+':'+f['path']);checked(b,f)
              p=out/f['path'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          receipt={'date':'2026-10-05','branch':branch,'publication_status':'remote_saved_and_git_fetch_byte_verified','input_head':spec['input_head'],'content_commit':commit,'remote_head_at_readback':remote,'publication_run_id':int(os.environ['GITHUB_RUN_ID']),'all_8_remote_files_byte_equal_reviewed_output':True,'target_blobs_checked_before_any_write':True,'all11_source_png_hashes_checked':True,'temporary_files_removed':True,'transport_normalization':'Three identified copy defects normalized as data, then each original part hash and complete payload hash verified before any document write.','counts':spec['counts'],'next_image':spec['next_image'],'files':[{k:f[k] for k in ['path','bytes','new_blob','new_sha256']} for f in spec['files']],'final_text_acceptance':False,'hardware_test_performed':False}
          rp=P('6601芯片截图/reviews/SARC_AUX_ROUND6_REMOTE_SAVE_20261005.json')
          assert not rp.exists()
          rb=(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n').encode();rp.write_bytes(rb)
          run('add','--',str(rp));run('commit','-m','docs(sarc): record auxiliary round6 remote readback')
          run('push','origin','HEAD:refs/heads/'+branch)
          run('fetch','origin','refs/heads/'+branch)
          assert git('show','FETCH_HEAD:'+str(rp))==rb
          (out/'READBACK.json').write_bytes(rb)
          with zipfile.ZipFile('checkpoint_readback.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in out.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(out))
          print('CONTENT_COMMIT',commit,'RECEIPT_COMMIT',git('rev-parse','HEAD').decode().strip())
      - uses: actions/upload-artifact@v4
        with:
          name: sarc-round6-full-readback
          path: checkpoint_readback.zip
          retention-days: 3
          if-no-files-found: error
