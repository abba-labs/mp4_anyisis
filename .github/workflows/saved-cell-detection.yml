name: Saved cell detector diagnosis
on:
  workflow_dispatch:
  push:
    branches: [feat/open-source-thin-pipeline-20260928]
    paths: [.github/workflows/saved-cell-detection.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PADDLE_PDX_MODEL_SOURCE: HF
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: ppstructure-3.7.0-paddlex-3.7.2-mobile-v1
          restore-keys: ppstructure-3.7.0-paddlex-3.7.2-models-
      - name: Restore immutable finished evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation/cell_detection work
          gh api repos/abba-labs/mp4_anyisis/actions/artifacts/10978920126/zip > work/baseline.zip
          echo '6a215eeb43435bd13619005fb8db87bcdc2cf4cd162315b6bd37cb88282f6f86  work/baseline.zip' | sha256sum -c -
          unzip -q work/baseline.zip -d work/baseline
          grep -vE '^(-e |mp4-analysis)' work/baseline/environment.txt > work/constraints.txt
      - name: Fixed environment and reproducible source snapshot
        run: |
          python -m pip install -c work/constraints.txt -e '.[parser,dev]' 'python-docx==1.2.0'
          python -m pip check
          python -m pip freeze > validation/cell_detection/environment.txt
          git rev-parse HEAD > validation/cell_detection/tested_commit.txt
          git archive HEAD src tests scripts pyproject.toml > validation/cell_detection/tested_source.tar
          python -m py_compile scripts/probe_saved_cell_detection.py
      - name: No OCR, only classification and cell detection
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=15 180 python -u scripts/probe_saved_cell_detection.py work/baseline/restored/sarc -o validation/cell_detection/results 2>&1 | tee validation/cell_detection/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-cell-detection-diagnosis
          path: validation/cell_detection/
          retention-days: 30
