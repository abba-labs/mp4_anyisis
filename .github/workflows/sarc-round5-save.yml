name: SARC round5 bounded save
on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: [.github/workflows/sarc-round5-save.yml]
permissions:
  contents: write
concurrency:
  group: sarc-restore-branch-save
  cancel-in-progress: false
jobs:
  save:
    if: github.ref == 'refs/heads/docs/restore-6601-screenshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/restore-6601-screenshots
          fetch-depth: 0
      - name: Check current blobs, publish bounded edits, fetch remote and export bytes
        shell: python
        run: |
          import base64,zlib,json,hashlib,subprocess,pathlib,zipfile
          def git(*args): return subprocess.check_output(['git',*args])
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          hashes=['6c8b7db566b84ddc8e76ff456caf177c7a0a6c6e','e1f530e5883a2f7239c73318318df030ad9c7625','548a58068db9528db332ef262faebf0e062e4509','ad5c3dc2bba056813b9f2c7f794d348c770d09cc','5794fb42695123dedba50e2a69f9ff989216c5eb']
          parts=[f'6601芯片截图/reviews/.round5_transport_{i}.txt' for i in range(1,6)]
          encoded=''
          for name,h in zip(parts,hashes):
              b=pathlib.Path(name).read_bytes()
              assert blob(b)==h,name+' transport mismatch: '+blob(b)
              encoded+=b.decode('ascii').strip()
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='71f249df692f9ad1c9515fb3d9af9d9a662109bac4b9b8be4b0d3394c90a0989'
          spec=json.loads(raw)
          branch='docs/restore-6601-screenshots'
          assert spec['branch']==branch
          subprocess.run(['git','merge-base','--is-ancestor',spec['input_head'],'HEAD'],check=True)
          def checked(b,f):
              assert len(b)==f['bytes'] and blob(b)==f['new_blob'] and hashlib.sha256(b).hexdigest()==f['new_sha256'],f['path']+' output mismatch'
          prepared={}
          for f in spec['files']:
              p=pathlib.Path(f['path'])
              assert not p.is_absolute() and '..' not in p.parts
              old=p.read_bytes() if p.exists() else None
              assert (blob(old) if old is not None else None)==f['old_blob'],str(p)+' stale current blob'
              if 'content' in f: text=f['content']
              elif 'patches' in f:
                  text=old.decode('utf-8')
                  for op in sorted(f['patches'],key=lambda o:o['start'],reverse=True): text=text[:op['start']]+op['new']+text[op['end']:]
              else:
                  tr=f['json_transform'];b=pathlib.Path(tr['base_path']).read_bytes()
                  assert blob(b)==tr['base_blob']
                  obj=json.loads(b);obj.update(tr['updates'])
                  for row in obj['images']: row.update(tr['image_updates'].get(str(row['order']),{}))
                  text=json.dumps(obj,ensure_ascii=False,indent=2)+'\n'
              b=text.encode('utf-8');checked(b,f);prepared[str(p)]=b
          assert len(prepared)==8
          for path,b in prepared.items():
              p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          temporary=parts+['.github/workflows/sarc-round5-save.yml']
          for path in temporary: pathlib.Path(path).unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*prepared.keys(),*temporary],check=True)
          staged=set(git('diff','--cached','--name-only','-z').decode().strip('\0').split('\0'))
          assert staged==set(prepared)|set(temporary),staged
          subprocess.run(['git','commit','-m','docs: restore final SARC LLD screenshots 37-40 and retain source gaps'],check=True)
          commit=git('rev-parse','HEAD').decode().strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          subprocess.run(['git','fetch','origin','refs/heads/'+branch],check=True)
          remote=git('rev-parse','FETCH_HEAD').decode().strip()
          rows=[]
          with zipfile.ZipFile('sarc-round5-readback.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in spec['files']:
                  b=git('show',remote+':'+f['path']);checked(b,f)
                  z.writestr(f['path'],b)
                  rows.append({k:f[k] for k in ['path','bytes','new_blob','new_sha256']})
              receipt={'branch':branch,'input_head':spec['input_head'],'content_commit':commit,'remote_head_at_readback':remote,'all_8_remote_files_match_reviewed_bytes':True,'temporary_files_deleted_in_content_commit':True,'files':rows}
              z.writestr('READBACK.json',json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print('PUBLISHED_AND_REMOTE_VERIFIED',commit,'files',len(rows))
      - uses: actions/upload-artifact@v4
        with:
          name: sarc-round5-full-readback
          path: sarc-round5-readback.zip
          retention-days: 3
          if-no-files-found: error
