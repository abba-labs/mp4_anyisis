name: sarc-round1-apply

on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths:
      - '.github/workflows/sarc-round1-apply.yml'
      - '.restore_transport/sarc_round1.part04'

permissions:
  contents: write

concurrency:
  group: sarc-round1-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate and publish exact reviewed bytes
        id: publish
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import shutil
          import subprocess

          branch = 'docs/restore-6601-screenshots'
          parts = [Path('.restore_transport/sarc_round1.part%02d' % i) for i in range(1, 5)]
          if not all(p.is_file() for p in parts):
              print('Payload incomplete; no document changes made.')
              raise SystemExit(0)
          def blob(b):
              return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          if hashlib.sha256(raw).hexdigest() != 'cf650d8a04116bf18bbe3d7a435f0e4c206420e954593e1e2c3e6b6b5cc72270':
              raise SystemExit('Transport hash mismatch; refuse to write.')
          data = json.loads(raw)
          allowed = {
              'NEXT_CHAT_HANDOFF.md',
              '6601芯片截图/RESTORE_PROGRESS.md',
              '6601芯片截图/sarc/sarc_lrs/docs/SARC_LRS设计文档.md',
              '6601芯片截图/sarc/SARC_6601修改点总览.md',
              '6601芯片截图/sarc/SARC_提取与验收报告.md',
              '6601芯片截图/reviews/SARC_ROUND1_IMAGE_LEDGER_20261005.json',
              '6601芯片截图/reviews/SARC_LRS_ROUND1_VERIFY_20261005.json'
          }
          if data['branch'] != branch or len(data['files']) != 7 or {f['path'] for f in data['files']} != allowed:
              raise SystemExit('Unexpected publication scope.')
          current = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
          if current != branch:
              raise SystemExit('Wrong work branch.')
          efc = {
              '6601芯片截图/efc/efc_lld/docs/EFC详细设计文档.md': '1d8a31f2411d177c628d002e3af842a0456857a7',
              '6601芯片截图/efc/efc_lrs/docs/EFC模块LRS设计文档.md': '2d83890325cfcb5b262f51ce52434ba90aa2f72b'
          }
          for name, expected in efc.items():
              if blob(Path(name).read_bytes()) != expected:
                  raise SystemExit('EFC baseline changed; review before proceeding.')
          source_workflow = Path('.github/workflows/sarc-source-bundle.yml')
          if blob(source_workflow.read_bytes()) != '94e788a22fbc5fa5480d52fa70aeb678784393bf':
              raise SystemExit('Source workflow changed; refuse cleanup.')
          prepared = []
          for f in data['files']:
              p = Path(f['path'])
              if p.is_symlink() or any(parent.is_symlink() for parent in p.parents):
                  raise SystemExit('Symlink in publication path.')
              if f['before'] is None:
                  if p.exists():
                      raise SystemExit('New file already exists: ' + str(p))
              elif not p.is_file() or blob(p.read_bytes()) != f['before']:
                  raise SystemExit('Current file changed: ' + str(p))
              b = f['text'].encode('utf-8')
              if blob(b) != f['after'] or hashlib.sha256(b).hexdigest() != f['sha256']:
                  raise SystemExit('Output hash mismatch: ' + str(p))
              prepared.append((p, b))
          for p, b in prepared:
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(b)
          subprocess.check_call(['git', 'add', '--'] + sorted(allowed))
          cleanup = [str(p) for p in parts] + ['.github/workflows/sarc-round1-apply.yml', str(source_workflow)]
          subprocess.check_call(['git', 'rm', '--'] + cleanup)
          subprocess.check_call(['git', 'config', 'user.name', 'github-actions[bot]'])
          subprocess.check_call(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
          subprocess.check_call(['git', 'commit', '-m', 'docs(sarc): restore LRS and source change index'])
          subprocess.check_call(['git', 'push', 'origin', 'HEAD:' + branch])
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/' + branch], text=True).split()[0]
          if head != remote:
              raise SystemExit('Remote advanced; re-read before acceptance.')
          for name, expected in efc.items():
              if blob(Path(name).read_bytes()) != expected:
                  raise SystemExit('Unexpected EFC modification.')
          out = Path('sarc_round1_readback')
          rows = []
          for p, b in prepared:
              saved = p.read_bytes()
              if saved != b:
                  raise SystemExit('Published bytes differ: ' + str(p))
              dst = out / 'files' / p
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(p, dst)
              rows.append({'path': str(p), 'bytes': len(b), 'git_blob': blob(b), 'sha256': hashlib.sha256(b).hexdigest()})
          result = {'commit': head, 'remote_head': remote, 'branch': branch, 'file_count': len(rows), 'files': rows,
                    'efc_unchanged': True, 'lrs_first_pass': 13, 'source_change_records': 32,
                    'source_unresolved_groups': 3, 'final_text_acceptance': False,
                    'note': 'Byte-level publication verification, not character accuracy acceptance.'}
          (out / 'READBACK.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ready=true\n')
          print('Published and checked:', head)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.publish.outputs.ready == 'true'
        with:
          name: sarc-round1-readback
          path: sarc_round1_readback/
          retention-days: 3
          if-no-files-found: error
