name: efc-round4-apply

on:
  workflow_dispatch:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: ['.github/workflows/efc-round4-apply.yml', '.github/efc-round4-payload.txt']

permissions:
  contents: write

concurrency:
  group: efc-round4-apply
  cancel-in-progress: false

jobs:
  apply-reviewed-text:
    if: github.ref == 'refs/heads/docs/restore-6601-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check whether the reviewed payload has arrived
        id: ready
        run: |
          if test -f .github/efc-round4-payload.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Payload not yet staged; no document is changed.'
          fi
      - name: Validate input and prepare exact reviewed bytes
        if: steps.ready.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          branch = 'refs/heads/docs/restore-6601-screenshots'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', branch], text=True).split()[0]
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != remote:
              raise SystemExit('Branch advanced. Refuse stale publication.')
          encoded = Path('.github/efc-round4-payload.txt').read_text(encoding='ascii')
          raw = lzma.decompress(base64.b64decode(''.join(encoded.split()), validate=True))
          if hashlib.sha256(raw).hexdigest() != '0c9a67abc5670871e9bf0007310df9d711d33a97b1aba0fdaa86c9a594c8eaa0':
              raise SystemExit('Payload checksum mismatch; no text written.')
          payload = json.loads(raw)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          prepared = {}
          for name, item in payload['files'].items():
              p = Path(name)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit('Unsafe path')
              if name != 'NEXT_CHAT_HANDOFF.md' and not name.startswith('6601芯片截图/'):
                  raise SystemExit('Path outside approved task')
              if item['before'] is None:
                  if p.exists():
                      raise SystemExit('New target exists: ' + name)
                  text = item['create']
              else:
                  data = p.read_bytes()
                  if blob(data) != item['before']:
                      raise SystemExit('Input changed; refuse overwrite: ' + name)
                  text = data.decode('utf-8')
                  for start, end, replacement in reversed(item['ops']):
                      text = text[:start] + replacement + text[end:]
              data = text.encode('utf-8')
              if blob(data) != item['after']:
                  raise SystemExit('Prepared output mismatch: ' + name)
              prepared[name] = data
          ledger = json.loads(prepared['6601芯片截图/reviews/EFC_ROUND4_IMAGE_LEDGER_20261005.json'])
          if len(ledger['records']) != 60:
              raise SystemExit('Expected 60 original images')
          for item in ledger['records']:
              data = Path(item['path']).read_bytes()
              if len(data) != item['bytes'] or blob(data) != item['git_blob'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit('Original image changed: ' + item['path'])
          for name, data in prepared.items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          out = Path('restore_output')
          out.mkdir(exist_ok=True)
          (out / 'EXPECTED.json').write_text(json.dumps({n: blob(d) for n, d in prepared.items()}, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Prepared and verified', len(prepared), 'text files; 60 original images unchanged.')
          PY
      - name: Commit only the reviewed text and remove one-off transport
        if: steps.ready.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          names = list(json.loads(Path('restore_output/EXPECTED.json').read_text(encoding='utf-8')))
          subprocess.run(['git', 'add', '--', *names], check=True)
          subprocess.run(['git', 'rm', '--', '.github/efc-round4-payload.txt', '.github/workflows/efc-round4-apply.yml'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs(efc): finish source review and record gaps'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:docs/restore-6601-screenshots'], check=True)
          PY
      - name: Read the pushed bytes back and package them privately
        if: steps.ready.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          out = Path('restore_output')
          expected = json.loads((out / 'EXPECTED.json').read_text(encoding='utf-8'))
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', 'docs/restore-6601-screenshots'], check=True)
          remote = subprocess.check_output(['git', 'rev-parse', 'FETCH_HEAD'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != remote:
              raise SystemExit('Remote advanced; publication needs review.')
          rows = []
          for name, want in expected.items():
              data = subprocess.check_output(['git', 'show', remote + ':' + name])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != want:
                  raise SystemExit('Remote output differs: ' + name)
              p = out / 'repo' / name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              rows.append({'path': name, 'bytes': len(data), 'git_blob': actual, 'sha256': hashlib.sha256(data).hexdigest()})
          record = {'commit': head, 'remote_head': remote, 'expected_matches_remote': True, 'file_count': len(rows), 'files': rows, 'final_text_acceptance': False, 'unresolved_source_groups': 5, 'note': 'Byte-level publication verification, not 100-percent character accuracy.'}
          (out / 'READBACK.json').write_text(json.dumps(record, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          name: efc-round4-readback
          path: restore_output/
          retention-days: 3
          if-no-files-found: error
