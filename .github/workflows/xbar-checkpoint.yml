name: XBAR bounded screenshot checkpoint
on:
  push:
    branches: [docs/restore-6601-screenshots]
    paths: [6601芯片截图/reviews/.xbar_payload.txt]
permissions:
  contents: write
concurrency:
  group: xbar-restore-checkpoint
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/restore-6601-screenshots
          fetch-depth: 0
      - name: Validate current blobs, publish and read remote bytes
        shell: python
        run: |
          import base64,lzma,json,pathlib,hashlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args])
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          branch='docs/restore-6601-screenshots'
          transport=pathlib.Path('6601芯片截图/reviews/.xbar_payload.txt')
          s=json.loads(lzma.decompress(base64.b64decode(transport.read_text().strip(),validate=True)))
          assert s['branch']==branch
          subprocess.run(['git','merge-base','--is-ancestor',s['input_head'],'HEAD'],check=True)
          assert git('rev-parse','HEAD:6601芯片截图/sarc/sarc_xbar/images').decode().strip()=='91682624c59903a7c29145d22acdd62e20b0bd8e'
          for path,expected in s['old_blobs'].items():
              p=pathlib.Path(path)
              assert not p.is_absolute() and '..' not in p.parts
              assert path in ['NEXT_CHAT_HANDOFF.md','6601芯片截图/RESTORE_PROGRESS.md'] or path.startswith(('6601芯片截图/sarc/sarc_xbar/','6601芯片截图/reviews/XBAR_'))
              current=blob(p.read_bytes()) if p.exists() else None
              assert current==expected,(path,'stale blob',current,expected)
          namespace={}
          exec(s['builder'],namespace)
          outputs=namespace['build']('.',s)
          assert set(outputs)==set(s['expected'])==set(s['old_blobs'])
          def check(path,b):
              e=s['expected'][path]
              assert len(b)==e['bytes'] and blob(b)==e['blob'] and hashlib.sha256(b).hexdigest()==e['sha256'],path+' output mismatch'
          for path,b in outputs.items(): check(path,b)
          for path,b in outputs.items():
              p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          transport.unlink()
          removed=[str(transport)]
          if s.get('final_batch'):
              workflow=pathlib.Path('.github/workflows/xbar-checkpoint.yml');workflow.unlink();removed.append(str(workflow))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*outputs,*removed],check=True)
          staged=set(git('diff','--cached','--name-only','-z').decode().strip('\0').split('\0'))
          assert staged==set(outputs)|set(removed)
          subprocess.run(['git','commit','-m',f"docs(xbar): restore screenshots {s['range'][0]}-{s['range'][1]}"],check=True)
          commit=git('rev-parse','HEAD').decode().strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          subprocess.run(['git','fetch','origin','refs/heads/'+branch],check=True)
          remote=git('rev-parse','FETCH_HEAD').decode().strip()
          out=pathlib.Path('xbar_readback');out.mkdir()
          for path in outputs:
              b=git('show',remote+':'+path);check(path,b)
              p=out/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          receipt={'date':'2026-10-06','branch':branch,'round':s['round'],'input_head':s['input_head'],'content_commit':commit,'remote_head_at_readback':remote,'publication_status':'remote_saved_and_git_fetch_byte_verified','all_target_bytes_match':True,'new_range':s['range'],'xbar_first_pass':s['count'],'repository_first_pass':124+s['count'],'changes':len(json.loads(outputs['6601芯片截图/reviews/XBAR_IMAGE_LEDGER_20261006.json'])['changes']),'gaps':len(json.loads(outputs['6601芯片截图/reviews/XBAR_IMAGE_LEDGER_20261006.json'])['gaps']),'files':s['expected'],'temporary_payload_removed':True,'temporary_workflow_removed':bool(s.get('final_batch')),'non_force_push':True,'other_ip_technical_bodies_unchanged':True,'final_text_acceptance':False,'hardware_test_performed':False}
          rp=pathlib.Path(f"6601芯片截图/reviews/XBAR_ROUND{s['round']}_REMOTE_SAVE_20261006.json")
          assert not rp.exists()
          b=(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n').encode();rp.write_bytes(b)
          subprocess.run(['git','add','--',str(rp)],check=True)
          subprocess.run(['git','commit','-m',f"docs(xbar): record checkpoint {s['round']} readback"],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          subprocess.run(['git','fetch','origin','refs/heads/'+branch],check=True)
          assert git('show','FETCH_HEAD:'+str(rp))==b
          p=out/rp;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          print('Saved and remote byte verified',commit,git('rev-parse','FETCH_HEAD').decode().strip())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xbar-checkpoint-readback
          path: xbar_readback/
          retention-days: 3
          if-no-files-found: error
