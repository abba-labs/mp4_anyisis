name: Thin adapter regressions
on:
  workflow_dispatch:
  push:
    branches: [feat/open-source-thin-pipeline-20260928]
    paths: [src/mp4_analysis/thin/**, tests/**, pyproject.toml, .github/workflows/adapter-tests.yml]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Test adapters and actual video codecs, not OCR accuracy
        run: |
          python -m pip install -e '.[dev]'
          mkdir -p validation/adapter_tests
          python -m pip freeze > validation/adapter_tests/environment.txt
          sha256sum src/mp4_analysis/thin/*.py tests/*.py > validation/adapter_tests/source_hashes.txt
          python -m pytest -q --junitxml=validation/adapter_tests/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-adapter-tests
          path: validation/adapter_tests/
          retention-days: 7
