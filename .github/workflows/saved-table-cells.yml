name: Saved ordinary-table structure control
on:
  workflow_dispatch:
  push:
    branches: [feat/open-source-thin-pipeline-20260928]
    paths: [.github/workflows/saved-table-cells.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PADDLE_PDX_MODEL_SOURCE: HF
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: ppstructure-3.7.0-paddlex-3.7.2-mobile-v1
          restore-keys: ppstructure-3.7.0-paddlex-3.7.2-models-
      - name: Read completed baseline without altering it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation/saved_table_cells work
          gh api repos/abba-labs/mp4_anyisis/actions/artifacts/10978920126/zip > work/baseline.zip
          echo '6a215eeb43435bd13619005fb8db87bcdc2cf4cd162315b6bd37cb88282f6f86  work/baseline.zip' | sha256sum -c -
          unzip -q work/baseline.zip -d work/baseline
          grep -vE '^(-e |mp4-analysis)' work/baseline/environment.txt > work/constraints.txt
      - name: Fixed dependencies, converter and regression checks
        run: |
          python -m pip install -c work/constraints.txt -e '.[parser,dev]' 'python-docx==1.2.0'
          python -m pip check
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-amd64.tar.gz -o work/pandoc.tar.gz
          tar -xzf work/pandoc.tar.gz -C work
          echo "$PWD/work/pandoc-3.1.11.1/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/work/pandoc-3.1.11.1/bin:$PATH"
          pandoc --version > validation/saved_table_cells/converter.txt
          sha256sum work/pandoc.tar.gz > validation/saved_table_cells/converter_sha256.txt
          python -m pip freeze > validation/saved_table_cells/environment.txt
          python -m pytest -q --junitxml=validation/saved_table_cells/tests.xml
          git rev-parse HEAD > validation/saved_table_cells/tested_commit.txt
          git archive HEAD src tests scripts pyproject.toml > validation/saved_table_cells/tested_source.tar
          python - <<'PY'
          from pathlib import Path
          import importlib.util, shutil
          spec = importlib.util.find_spec('paddlex')
          root = Path(spec.origin).parent
          dest = Path('validation/saved_table_cells/upstream'); dest.mkdir()
          shutil.copy2(root/'inference/pipelines/table_recognition/pipeline_v2.py', dest/'table_pipeline_v2.py')
          PY
      - name: Same-engine four-input control, never full-timeline rerun
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=15 300 python -u scripts/probe_saved_table_cells.py work/baseline/restored/sarc -o validation/saved_table_cells/results 2>&1 | tee validation/saved_table_cells/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-table-cells-control
          path: validation/saved_table_cells/
          retention-days: 30
