name: Table geometry and OCR probe
on:
  workflow_dispatch:
  push:
    branches: [feat/open-source-thin-pipeline-20260928]
    paths: [.github/workflows/table-geometry-ocr-probe.yml, scripts/probe_grid_ocr.py, tests/test_grid_geometry.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated native candidate
        run: |
          python -m pip install 'img2table[rapidocr]==2.0.0' 'rapidocr==3.9.2' 'onnxruntime==1.23.2' 'av==16.0.1' 'Pillow>=10,<13' 'pytest>=8,<10'
          mkdir -p validation/geometry_ocr
          python -m pip freeze > validation/geometry_ocr/environment.txt
      - name: Regression tests including real video codec
        run: python -m pytest -q --junitxml=validation/geometry_ocr/tests.xml
      - name: Native OCR and geometry comparisons
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5 330 python -u -m scripts.probe_grid_ocr validation/geometry_ocr 2>&1 | tee validation/geometry_ocr/run.log
      - name: Candidate content acceptance, not execution success
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('validation/geometry_ocr/summary.json').read_text(encoding='utf-8'))
          accepted=[x['name'] for x in data if x.get('acceptance_passed')]
          print('Accepted candidates:',accepted)
          if not accepted: raise SystemExit('No candidate passed unchanged content and geometry checks')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-geometry-ocr-probe
          path: validation/geometry_ocr/
          retention-days: 7
