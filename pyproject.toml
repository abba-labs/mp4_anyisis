[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mp4-analysis"
version = "0.2.0.dev1"
description = "High-fidelity video-to-document analysis and reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "abba-labs", email = "dev@abba-labs.com" }
]
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "rapidocr-onnxruntime>=1.3.0",
    "rapid-layout>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]
advanced = [
    "docling>=2.0.0"
]

[project.scripts]
mp4-analysis = "mp4_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
